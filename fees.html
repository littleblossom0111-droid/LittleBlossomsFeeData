<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fee Entry</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
DAY CARE - FEE ENTRY
</header>

<div class="container">

<div class="card">

<h2>Enter Student Fee</h2>

<select id="student" onchange="showFee()">
<option value="">Select Student</option>
</select>


<select id="month">
<option>January</option>
<option>February</option>
<option>March</option>
<option>April</option>
<option>May</option>
<option>June</option>
<option>July</option>
<option>August</option>
<option>September</option>
<option>October</option>
<option>November</option>
<option>December</option>
</select>


<input type="number" id="totalfee" placeholder="Monthly Fee" readonly>

<input type="number" id="paidfee" placeholder="Paid Fee">

<input type="number" id="pendingfee" placeholder="Pending Fee" readonly>


<label>Payment Date</label>
<input type="date" id="date">


<button id="feeBtn" onclick="saveFee()">
Save Fee
</button>


<button class="back" onclick="window.location='dashboard.html'">
Back Dashboard
</button>

</div>



<div class="card">

<h2>Fee History</h2>


<table>

<thead>

<tr>
<th>Student</th>
<th>Month</th>
<th>Paid</th>
<th>Pending</th>
<th>Action</th>
</tr>

</thead>


<tbody id="feeList"></tbody>


</table>

</div>


</div>



<script>


let students = JSON.parse(localStorage.getItem("students")) || [];

let fees = JSON.parse(localStorage.getItem("fees")) || [];

let editFeeIndex = -1;



// Student Dropdown

let select=document.getElementById("student");


students.forEach(function(s){

let op=document.createElement("option");

op.value=s.id;

op.text=s.name;

select.appendChild(op);

});



// Show Fee

function showFee(){

let id=document.getElementById("student").value;


let s=students.find(function(x){

return x.id==id;

});


if(s){

document.getElementById("totalfee").value=s.monthlyfee;

calculatePending();

}

}




document.getElementById("paidfee").addEventListener("input",calculatePending);



function calculatePending(){

let total=Number(document.getElementById("totalfee").value||0);

let paid=Number(document.getElementById("paidfee").value||0);


document.getElementById("pendingfee").value=total-paid;

}



// Save / Update Fee

function saveFee(){


let id=document.getElementById("student").value;


let s=students.find(function(x){

return x.id==id;

});


let fee={

student:s.name,

studentId:s.id,

month:document.getElementById("month").value,

total:document.getElementById("totalfee").value,

paid:document.getElementById("paidfee").value,

pending:document.getElementById("pendingfee").value,

date:document.getElementById("date").value

};



if(editFeeIndex==-1){

fees.push(fee);

alert("Fee Saved Successfully");

}

else{

fees[editFeeIndex]=fee;

alert("Fee Updated Successfully");

editFeeIndex=-1;

}



localStorage.setItem("fees",JSON.stringify(fees));

location.reload();

}



// Show History

function showFees(){

let data="";


fees.forEach(function(f,index){


data+=`

<tr>

<td>${f.student}</td>

<td>${f.month}</td>

<td>₹${f.paid}</td>

<td>₹${f.pending}</td>

<td>

<button class="edit" onclick="editFee(${index})">
✏️
</button>

<button class="delete" onclick="deleteFee(${index})">
🗑️
</button>

</td>

</tr>

`;

});


document.getElementById("feeList").innerHTML=data;

}



showFees();




// Edit Fee

function editFee(index){

let pass=prompt("Enter Admin Password");


if(pass==localStorage.getItem("adminPassword")){


let f=fees[index];


editFeeIndex=index;


document.getElementById("student").value=f.studentId;

document.getElementById("month").value=f.month;

document.getElementById("totalfee").value=f.total;

document.getElementById("paidfee").value=f.paid;

document.getElementById("pendingfee").value=f.pending;

document.getElementById("date").value=f.date;


window.scrollTo(0,0);


document.getElementById("feeBtn").innerHTML="Update Fee";


}

else{

alert("Wrong Password");

}

}




// Delete Fee

function deleteFee(index){


let pass=prompt("Enter Admin Password");


if(pass==localStorage.getItem("adminPassword")){


if(confirm("Delete Fee Entry?")){


fees.splice(index,1);


localStorage.setItem("fees",JSON.stringify(fees));


location.reload();


}


}

else{

alert("Wrong Password");

}

}



</script>


</body>
</html>
