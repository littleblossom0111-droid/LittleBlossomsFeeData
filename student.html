<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
DAY CARE - STUDENT REGISTRATION
</header>


<div class="container">


<div class="card">

<h2>Add New Student</h2>


<input type="text" id="name" placeholder="Student Name">

<input type="text" id="father" placeholder="Father Name">

<input type="text" id="mother" placeholder="Mother Name">

<input type="number" id="mobile" placeholder="Mobile Number">

<textarea id="address" placeholder="Address"></textarea>

<label>Admission Date</label>
<input type="date" id="admission">


<label>Date of Birth</label>
<input type="date" id="dob">


<input type="number" id="regfee" placeholder="One Time Registration Fee">

<input type="number" id="monthlyfee" placeholder="Monthly Fee">


<button onclick="saveStudent()">
Save Student
</button>


<button class="back" onclick="window.location='dashboard.html'">
Back To Dashboard
</button>


</div>



<div class="card">

<h2>Student List</h2>


<input class="search" 
type="text" 
id="search" 
placeholder="Search Student Name"
onkeyup="searchStudent()">


<table>

<thead>

<tr>
<th>ID</th>
<th>Name</th>
<th>Mobile</th>
<th>Monthly Fee</th>
</tr>

</thead>


<tbody id="studentList">

</tbody>


</table>


</div>


</div>



<script>


let students = JSON.parse(localStorage.getItem("students")) || [];

displayStudents();



function saveStudent(){


let student={

id:"DC"+String(students.length+1).padStart(3,"0"),

name:document.getElementById("name").value,

father:document.getElementById("father").value,

mother:document.getElementById("mother").value,

mobile:document.getElementById("mobile").value,

address:document.getElementById("address").value,

admission:document.getElementById("admission").value,

dob:document.getElementById("dob").value,

regfee:document.getElementById("regfee").value,

monthlyfee:document.getElementById("monthlyfee").value

};


students.push(student);


localStorage.setItem("students",JSON.stringify(students));


alert("Student Saved");


location.reload();


}



function displayStudents(){


let data="";


students.forEach(function(s){


data += `

<tr>

<td>${s.id}</td>

<td>${s.name}</td>

<td>${s.mobile}</td>

<td>₹${s.monthlyfee}</td>


</tr>

`;


});


document.getElementById("studentList").innerHTML=data;


}



function searchStudent(){


let value=document.getElementById("search").value.toLowerCase();


let rows="";


students.filter(function(s){


return s.name.toLowerCase().includes(value);


}).forEach(function(s){


rows +=`

<tr>

<td>${s.id}</td>

<td>${s.name}</td>

<td>${s.mobile}</td>

<td>₹${s.monthlyfee}</td>

</tr>

`;

});


document.getElementById("studentList").innerHTML=rows;


}


</script>


</body>
</html>
