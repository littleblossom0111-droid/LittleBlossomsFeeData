<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Blossoms Day Care</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="sidebar">

    <h2>🌸 Little Blossoms</h2>

    <button onclick="showPage('dashboard')">Dashboard</button>

    <button onclick="showPage('students')">Students</button>

    <button onclick="showPage('fees')">Fees</button>

    <button onclick="showPage('expenses')">Expenses</button>

    <button onclick="showPage('reports')">Reports</button>

</div>


<div class="content">

    <!-- Dashboard -->

    <section id="dashboard" class="page">

        <h1>Dashboard</h1>

        <div class="cards">

            <div class="card">
                <h3>Total Students</h3>
                <h2 id="totalStudents">0</h2>
            </div>

            <div class="card">
                <h3>Monthly Fees</h3>
                <h2 id="monthlyFees">₹0</h2>
            </div>

            <div class="card">
                <h3>Fees Received</h3>
                <h2 id="feesReceived">₹0</h2>
            </div>

            <div class="card">
                <h3>Pending Fees</h3>
                <h2 id="pendingFees">₹0</h2>
            </div>

            <div class="card">
                <h3>Registration</h3>
                <h2 id="registrationFees">₹0</h2>
            </div>

            <div class="card">
                <h3>Expenses</h3>
                <h2 id="expenses">₹0</h2>
            </div>

            <div class="card">
                <h3>Net Income</h3>
                <h2 id="netIncome">₹0</h2>
            </div>

        </div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
