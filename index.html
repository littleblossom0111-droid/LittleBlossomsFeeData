<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day Care Management Login</title>

<style>
body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background:#4CAF50;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:white;
    padding:30px;
    width:320px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.3);
    text-align:center;
}

h2{
    color:#4CAF50;
}

input{
    width:90%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:95%;
    padding:12px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#388E3C;
}

#msg{
    color:red;
    margin-top:10px;
}
</style>

</head>
<body>

<div class="login-box">

<h2>DAY CARE LOGIN</h2>

<input type="password" id="password" placeholder="Enter Password">

<button onclick="login()">Login</button>

<p id="msg"></p>

</div>

<script>

if(localStorage.getItem("adminPassword")==null){
    localStorage.setItem("adminPassword","1234");
}

function login(){

let pass=document.getElementById("password").value;

let saved=localStorage.getItem("adminPassword");

if(pass==saved){

window.location="dashboard.html";

}else{

document.getElementById("msg").innerHTML="Wrong Password";

}

}

</script>

</body>
</html>
