<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Day Care Dashboard</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f2f2f2;
}

header{
background:#4CAF50;
color:white;
padding:18px;
text-align:center;
font-size:26px;
font-weight:bold;
}

.container{
width:95%;
max-width:1000px;
margin:20px auto;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.2);
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.box{
background:#4CAF50;
color:white;
padding:20px;
border-radius:10px;
text-align:center;
}

.buttons{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

button{
padding:15px;
border:none;
border-radius:10px;
background:#2196F3;
color:white;
font-size:16px;
cursor:pointer;
}

.logout{
background:red;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th{
background:#4CAF50;
color:white;
padding:10px;
}

td{
padding:10px;
text-align:center;
border-bottom:1px solid #ddd;
}

</style>


</head>


<body>


<header>
DAY CARE MANAGEMENT SYSTEM
</header>



<div class="container">



<div class="card">

<h2 style="text-align:center;margin-bottom:20px;">
Dashboard
</h2>



<div class="grid">


<div class="box">
<h2 id="students">0</h2>
<p>Total Students</p>
</div>


<div class="box">
<h2 id="registration">₹0</h2>
<p>Registration Fee</p>
</div>


<div class="box">
<h2 id="fees">₹0</h2>
<p>Fee Received</p>
</div>


<div class="box">
<h2 id="pending">₹0</h2>
<p>Pending Fee</p>
</div>


<div class="box">
<h2 id="expense">₹0</h2>
<p>Expense</p>
</div>


<div class="box">
<h2 id="balance">₹0</h2>
<p>Balance</p>
</div>


</div>

</div>





<div class="card">

<h2>Student Fee History</h2>


<table>

<thead>

<tr>
<th>Name</th>
<th>Month</th>
<th>Paid</th>
<th>Pending</th>
<th>Date</th>
</tr>

</thead>


<tbody id="feeHistory">

</tbody>


</table>

</div>





<div class="card">

<h2>Registration History</h2>


<table>

<thead>

<tr>

<th>Student Name</th>
<th>Registration Fee</th>
<th>Registration Date</th>

</tr>


</thead>



<tbody id="registrationHistory">

</tbody>



</table>


</div>






<div class="card">

<div class="buttons">


<button onclick="window.location='students.html'">
👧 Student Registration
</button>


<button onclick="window.location='fees.html'">
💰 Fee Entry
</button>


<button onclick="window.location='expense.html'">
💸 Expense Entry
</button>


<button onclick="window.location='reports.html'">
📊 Monthly Reports
</button>


<button onclick="window.location='pending.html'">
⏳ Pending Fees
</button>


<button onclick="window.location='settings.html'">
⚙ Settings
</button>


<button class="logout" onclick="logout()">
🚪 Logout
</button>


</div>

</div>



</div>





<script>


let students = JSON.parse(localStorage.getItem("students")) || [];

let fees = JSON.parse(localStorage.getItem("fees")) || [];

let expenses = JSON.parse(localStorage.getItem("expenses")) || [];



// Total Students

document.getElementById("students").innerHTML =
students.length;



// Registration Total

let registration = 0;


students.forEach(function(s){

registration += Number(s.regfee || 0);

});


document.getElementById("registration").innerHTML =
"₹"+registration;





// Fee History

let totalFee = 0;

let totalPending = 0;

let history = "";



fees.forEach(function(f){


totalFee += Number(f.paid || 0);

totalPending += Number(f.pending || 0);



history += `

<tr>

<td>${f.student}</td>

<td>${f.month}</td>

<td>₹${f.paid}</td>

<td>₹${f.pending}</td>

<td>${f.date}</td>

</tr>

`;

});



document.getElementById("fees").innerHTML =
"₹"+totalFee;


document.getElementById("pending").innerHTML =
"₹"+totalPending;


document.getElementById("feeHistory").innerHTML =
history;






// Registration History

let registrationHistory = "";


students.forEach(function(s){


registrationHistory += `

<tr>

<td>${s.name}</td>

<td>₹${s.regfee || 0}</td>

<td>${s.regdate || "-"}</td>

</tr>

`;

});


document.getElementById("registrationHistory").innerHTML =
registrationHistory;






// Expense

let totalExpense = 0;


expenses.forEach(function(e){

totalExpense += Number(e.amount || 0);

});


document.getElementById("expense").innerHTML =
"₹"+totalExpense;





// Balance

let balance = registration + totalFee - totalExpense;


document.getElementById("balance").innerHTML =
"₹"+balance;





function logout(){

window.location="index.html";

}


</script>


</body>

</html>
