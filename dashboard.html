<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day Care Management System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f2f2f2;
}

header{
background:#4CAF50;
color:white;
padding:18px;
text-align:center;
font-size:26px;
font-weight:bold;
}

.container{
width:95%;
max-width:900px;
margin:20px auto;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.2);
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.box{
background:#4CAF50;
color:white;
padding:20px;
border-radius:10px;
text-align:center;
}

.box h2{
margin-bottom:10px;
}

.buttons{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-top:20px;
}

button{
padding:15px;
font-size:16px;
border:none;
border-radius:10px;
cursor:pointer;
background:#2196F3;
color:white;
}

button:hover{
background:#0b7dda;
}

.logout{
background:red;
}

.logout:hover{
background:darkred;
}

</style>
</head>

<body>

<header>

DAY CARE MANAGEMENT SYSTEM

</header>

<div class="container">

<div class="card">

<h2 style="text-align:center;margin-bottom:20px;">
Dashboard
</h2>

<div class="grid">

<div class="box">
<h2 id="students">0</h2>
<p>Total Students</p>
</div>

<div class="box">
<h2 id="registration">₹0</h2>
<p>Registration Fee</p>
</div>

<div class="box">
<h2 id="fees">₹0</h2>
<p>Monthly Fees</p>
</div>

<div class="box">
<h2 id="pending">₹0</h2>
<p>Pending Fees</p>
</div>

<div class="box">
<h2 id="expense">₹0</h2>
<p>Total Expense</p>
</div>

<div class="box">
<h2 id="balance">₹0</h2>
<p>Balance</p>
</div>

</div>

</div>

<div class="card">

<div class="buttons">

<button onclick="window.location='students.html'">
👧 Student Registration
</button>

<button onclick="window.location='fees.html'">
💰 Fee Entry
</button>

<button onclick="window.location='expense.html'">
💸 Expense Entry
</button>

<button onclick="window.location='reports.html'">
📊 Monthly Reports
</button>

<button onclick="window.location='pending.html'">
⏳ Pending Fees
</button>

<button onclick="window.location='settings.html'">
⚙ Settings
</button>

<button class="logout" onclick="logout()">
🚪 Logout
</button>

</div>

</div>

</div>

<script>

let students=JSON.parse(localStorage.getItem("students"))||[];

document.getElementById("students").innerHTML=students.length;

let registration=0;

students.forEach(function(s){

registration+=Number(s.regfee||0);

});

document.getElementById("registration").innerHTML="₹"+registration;

// अभी बाकी डेटा 0 रहेगा,
// अगले स्टेप में Fee Entry और Expense जोड़ेंगे

document.getElementById("fees").innerHTML="₹0";

document.getElementById("pending").innerHTML="₹0";

document.getElementById("expense").innerHTML="₹0";

document.getElementById("balance").innerHTML="₹"+registration;

function logout(){

window.location="index.html";

}

</script>

</body>
</html>
